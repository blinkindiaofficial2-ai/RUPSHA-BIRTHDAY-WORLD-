<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown - Feb 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
    /* টাচ পার্টিকেল স্টাইল */
.m-particle {
    position: fixed; 
    pointer-events: none; 
    z-index: 9999;
    font-size: 24px; /* হার্টের সাইজ */
    animation: moveParticle 1.2s ease-out forwards;
}

@keyframes moveParticle {
    0% { 
        transform: translate(0, 0) scale(1) rotate(0deg); 
        opacity: 1; 
    }
    100% { 
        transform: translate(var(--mx), var(--my)) scale(0) rotate(360deg); 
        opacity: 0; 
    }
}

    
    
    
        :root {
            --accent-pink: #ff2e7e;
            --soft-pink: #ff85a1;
            --neon-pink: #ff007f;
            --aura-glow: rgba(255, 0, 127, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --header-h: 60px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width:100vw !important;
            height:100vh !important;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at bottom, #0d0d0d 0%, #000000 100%);
            color: white;
            overflow:hidden !important;
            position:fixed !important;
            display: flex;
            justify-content: center;
            align-items: center;
            top : 0;
            left : 0;
            position:fixed !important;
        }

        /* লোগো সেকশন - হেডারের ঠিক নিচে */
        .logo-under-header {
            position: fixed;
            top: 50px; /* হেডারের উচ্চতা ৬০ পিক্সেল, তাই ৮০ পিক্সেল নিচে দেওয়া হয়েছে */
            right: 35%;
            transform: translateX(-50%);
            z-index: 5000;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
            
            
        }

        .logo-under-header img {
            width: 180px; /* লোগোর সাইজ এখান থেকে ছোট-বড় করতে পারবেন */
            height: auto;
            border-radius: 40%; /* গোল করার ট্যাগ */
    object-fit: cover; 
            opacity: 0.8;
            transition: 0.3s;
            
    
            
        }
        
        .logo-under-header img:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* ১. তারা (Stars) */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle var(--t) infinite ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ২. বেলুন লেয়ার */
        .balloon-container {
            position: absolute;
            bottom: -250px;
            animation: floatUp var(--d) linear forwards;
            z-index: 2;
            will-change: transform;
            opacity: 1.0; 
        }

        .balloon-body {
            width: 50px;
            height: 65px;
            border-radius: 80%;
            position: relative;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
        }

        .balloon-string {
            width: 1px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform-origin: top center;
            animation: wiggle 3s infinite ease-in-out;
        }

        @keyframes wiggle {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-80%) rotate(8deg); }
            75% { transform: translateX(-50%) rotate(-5deg); }
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 0, 0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translate3d(0, -150vh, 0); opacity: 0; }
        }

        /* ৩. মেনু কন্টেইনার */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03); 
            padding: 40px 30px;
            border-radius: 25px;
            border: 1px solid rgba(255, 46, 126, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            z-index: 10;
            position: relative;
        }
    
    body{
overflow-x:hidden !important;
}

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.6rem;
            color: var(--accent-pink);
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 46, 126, 0.5);
        }

        .countdown-wrapper {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .circle-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        svg {
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
        }

        circle {
            fill: none;
            stroke-width: 5;
            stroke-linecap: round;
        }

        .bg-circle { stroke: rgba(255, 255, 255, 0.05); }
        .progress-circle {
            stroke: var(--accent-pink);
            stroke-dasharray: 226;
            stroke-dashoffset: 226;
            transition: stroke-dashoffset 1s linear;
        }

        .text-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .number { font-size: 1.2rem; font-weight: 600; display: block; }
        .label { font-size: 0.5rem; text-transform: uppercase; color: var(--soft-pink); }

        /* এন্ট্রেন্স এনিমেশন */
        @keyframes headerSlideDown {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* মেইন হেডার স্টাইল */
        .celestial-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-h);
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            box-sizing: border-box;
            z-index: 10000;
            cursor: pointer;
            animation: headerSlideDown 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .neon-wire {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.1);
        }

        .wire-glow {
            position: absolute;
            height: 100%;
            width: 150px;
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
            box-shadow: 0 0 15px var(--neon-pink);
            animation: moveLight 4s infinite linear;
        }

        @keyframes moveLight {
            0% { left: -150px; }
            100% { left: 100%; }
        }

        .brand-zone {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-top {
            font-size: 8px;
            letter-spacing: 5px;
            color: var(--neon-pink);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .brand-main {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-heart {
            width: 6px;
            height: 6px;
            background: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-pink);
            animation: heartPulse 1.5s infinite;
        }

        @keyframes heartPulse {
            0% { transform: scale(1); box-shadow: 0 0 5px var(--neon-pink); }
            50% { transform: scale(1.6); box-shadow: 0 0 20px var(--neon-pink); }
            100% { transform: scale(1); box-shadow: 0 0 5px var(--neon-pink); }
        }

        .vibe-tag {
            font-family: sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }
    
    .pp {
       font-size: 0.7rem;
        
    }
    
    /* ডট লোডার অ্যানিমেশন */
.dot-loader::after {
    content: '';
    display: inline-block;
    width: 25px; /* ডটগুলোর জন্য জায়গা */
    text-align: left;
    animation: dots 2s steps(4, end) infinite;
    
}

@keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80% { content: '...'; }
    100% { content: '....'; }
}

        
    </style>
</head>
<body>
    
    <header class="celestial-header" onclick="changeAura()">
        <div class="brand-zone">
            <span class="brand-top">Birthday Edition v.01</span>
            <span class="brand-main">RUPSHA'S WORLD</span>
        </div>

        <div class="status-box">
            <span class="vibe-tag" id="vibeName">Aura: Pink</span>
            <div class="pulse-heart"></div>
        </div>

        <div class="neon-wire">
            <div class="wire-glow"></div>
        </div>
    </header>
 <div class="logo-under-header">
        <img src="https://raw.githubusercontent.com/blinkindiaofficial2-ai/My-image-/refs/heads/main/file_0000000026287208964fe46c324c213c.png" alt="Logo"> </div>

    <div id="decor-container"></div>

    <div class="container">
        
        <h1>Rupsha's Birthday World Coming Soon<span class="dot-loader"></span></h1>

        <p class="pp" style="color: var(--soft-pink); letter-spacing: 2px; margin: 10px 0;">Official Launch on February 11th 2027</p>
        
        <div class="countdown-wrapper">
            <div class="circle-container">
                <svg><circle class="bg-circle" cx="40" cy="40" r="36"></circle><circle id="days-circle" class="progress-circle" cx="40" cy="40" r="36"></circle></svg>
                <div class="text-box"><span id="days" class="number">00</span><span class="label">Days</span></div>
            </div>
            <div class="circle-container">
                <svg><circle class="bg-circle" cx="40" cy="40" r="36"></circle><circle id="hours-circle" class="progress-circle" cx="40" cy="40" r="36"></circle></svg>
                <div class="text-box"><span id="hours" class="number">00</span><span class="label">Hours</span></div>
            </div>
            <div class="circle-container">
                <svg><circle class="bg-circle" cx="40" cy="40" r="36"></circle><circle id="minutes-circle" class="progress-circle" cx="40" cy="40" r="36"></circle></svg>
                <div class="text-box"><span id="minutes" class="number">00</span><span class="label">Mins</span></div>
            </div>
            <div class="circle-container">
                <svg><circle class="bg-circle" cx="40" cy="40" r="36"></circle><circle id="seconds-circle" class="progress-circle" cx="40" cy="40" r="36"></circle></svg>
                <div class="text-box"><span id="seconds" class="number">00</span><span class="label">Secs</span></div>
            </div>
        </div>
    </div>

    <script>
        // বার্থডে থিম ইঞ্জিন
        let currentMode = 0;
        const modes = [
            { color: "#ff007f", glow: "rgba(255, 0, 127, 0.4)", name: "Aura: Pink" },
            { color: "#00d4ff", glow: "rgba(0, 212, 255, 0.4)", name: "Aura: Sky" },
            { color: "#bd00ff", glow: "rgba(189, 0, 255, 0.4)", name: "Aura: Magic" }
        ];

        function changeAura() {
            currentMode = (currentMode + 1) % modes.length;
            const theme = modes[currentMode];
            const root = document.documentElement;
            root.style.setProperty('--neon-pink', theme.color);
            root.style.setProperty('--aura-glow', theme.glow);
            const vibeElement = document.getElementById('vibeName');
            if(vibeElement) vibeElement.innerText = theme.name;
            const header = document.querySelector('.celestial-header');
            if(header) {
                header.style.backgroundColor = "rgba(255, 255, 255, 0.1)";
                setTimeout(() => { header.style.backgroundColor = "rgba(255, 255, 255, 0.03)"; }, 300);
            }
        }

        const body = document.body;
        const starCount = 80; 
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--t', (Math.random() * 3 + 2) + 's');
            fragment.appendChild(star);
        }
        body.appendChild(fragment);

        const decor = document.getElementById('decor-container');
        const colors = ['#FF2E7E', '#FF85A1', '#B76E79', '#FFB6C1', '#702963', '#C0C0C0', '#E0B0FF', '#FFD1DC'];

        function createBalloon() {
            if(decor.childElementCount > 20) return; 
            const container = document.createElement('div');
            container.className = 'balloon-container';
            const balloon = document.createElement('div');
            balloon.className = 'balloon-body';
            balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            const string = document.createElement('div');
            string.className = 'balloon-string';
            container.appendChild(balloon);
            container.appendChild(string);
            container.style.left = Math.random() * 95 + '%';
            container.style.setProperty('--d', (Math.random() * 6 + 10) + 's');
            decor.appendChild(container);
            setTimeout(() => { container.remove(); }, 16000);
        }

        function initBalloons() { for(let i = 0; i < 5; i++) { setTimeout(createBalloon, i * 150); } }
        initBalloons();
        setInterval(createBalloon, 1800); 

        function update() {
            const now = new Date();
            let target = new Date(now.getFullYear(), 1, 11);
            if (now > target) target = new Date(now.getFullYear() + 1, 1, 11);
            const diff = target - now;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('days').innerText = d;
            document.getElementById('hours').innerText = h.toString().padStart(2,'0');
            document.getElementById('minutes').innerText = m.toString().padStart(2,'0');
            document.getElementById('seconds').innerText = s.toString().padStart(2,'0');
            setProgress('days-circle', d, 365);
            setProgress('hours-circle', h, 24);
            setProgress('minutes-circle', m, 60);
            setProgress('seconds-circle', s, 60);
        }

        function setProgress(id, val, max) {
            const circle = document.getElementById(id);
            if(circle) {
                const offset = 226 - (val / max) * 226;
                circle.style.strokeDashoffset = offset;
            }
        }
        setInterval(update, 1000);
        update();
            
            
            // মাউস ক্লিক এবং মোবাইল টাচ ইফেক্ট
document.addEventListener('mousedown', createMagic);
document.addEventListener('touchstart', (e) => {
    createMagic(e.touches[0]);
}, {passive: true});

function createMagic(e) {
    const items = ['💖', '✨', '🌸', '🎂', '🎈']; // যা যা বের হবে
    for (let i = 0; i < 8; i++) { // একসাথে ৮টি পার্টিকেল বের হবে
        const p = document.createElement('div');
        p.className = 'm-particle';
        p.innerHTML = items[Math.floor(Math.random() * items.length)];
        p.style.left = e.clientX + 'px'; 
        p.style.top = e.clientY + 'px';
        
        // র্যান্ডম দিকে ছড়িয়ে যাওয়ার জন্য (X এবং Y অক্ষ)
        const mx = (Math.random() - 0.5) * 300 + "px";
        const my = (Math.random() - 0.5) * 300 + "px";
        p.style.setProperty('--mx', mx); 
        p.style.setProperty('--my', my);
        
        document.body.appendChild(p);
        
        // ১.২ সেকেন্ড পর পার্টিকেল মুছে যাবে
        setTimeout(() => p.remove(), 1200);
    }
}

    </script>

        margin: 0;

        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        line-height: 1.4;
    ">
        <span style="font-weight: 300;">©2026</span> 
        <span style="margin: 0 5px; opacity: 0.3;">|</span> 
        <span style="font-weight: 600; color: #ff007f; font-style: italic;">RUPSHA'S DIGITAL WORLD</span>
        <br> <span style="font-weight: 450; letter-spacing: 0.5px;">Developed by</span> 
        <span style="font-weight: 700; color: #fff; border-bottom: 1px solid rgba(255, 0, 127, 0.5);">💖 PIYAS</span>

</body>
</html>
