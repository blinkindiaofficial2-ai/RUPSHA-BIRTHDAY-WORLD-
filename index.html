    <style>
    
    
    
    /* টাচ পার্টিকেল স্টাইল */
.m-particle {
    position: fixed; 
    pointer-events: none; 
    z-index: 9999;
    font-size: 24px; /* হার্টের সাইজ */
    animation: moveParticle 1.2s ease-out forwards;
}

@keyframes moveParticle {
    0% { 
        transform: translate(0, 0) scale(1) rotate(0deg); 
        opacity: 1; 
    }
    100% { 
        transform: translate(var(--mx), var(--my)) scale(0) rotate(360deg); 
        opacity: 0; 
    }
}

    
    
    
        :root {
            --accent-pink: #ff2e7e;
            --soft-pink: #ff85a1;
            --neon-pink: #ff007f;
            --aura-glow: rgba(255, 0, 127, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --header-h: 60px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width:100vw !important;
            height:100vh !important;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at bottom, #0d0d0d 0%, #000000 100%);
            color: white;
            overflow:hidden !important;
            position:fixed !important;
            display: flex;
            justify-content: center;
            align-items: center;
            top : 0;
            left : 0;
            position:fixed !important;
        }

    
    
        /* লোগো সেকশন - হেডারের ঠিক নিচে */
        .logo-under-header {
            position: fixed;
            top: 50px; /* হেডারের উচ্চতা ৬০ পিক্সেল, তাই ৮০ পিক্সেল নিচে দেওয়া হয়েছে */
            right: 35%;
            transform: translateX(-50%);
            z-index: 5000;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
            
            
        }

        .logo-under-header img {
            width: 180px; /* লোগোর সাইজ এখান থেকে ছোট-বড় করতে পারবেন */
            height: auto;
            border-radius: 40%; /* গোল করার ট্যাগ */
    object-fit: cover; 
            opacity: 0.8;
            transition: 0.3s;
            
    
            
        }
        
        .logo-under-header img:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* ১. তারা (Stars) */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle var(--t) infinite ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ২. বেলুন লেয়ার */
        .balloon-container {
            position: absolute;
            bottom: -250px;
            animation: floatUp var(--d) linear forwards;
            z-index: 2;
            will-change: transform;
            opacity: 1.0; 
        }

        .balloon-body {
            width: 50px;
            height: 65px;
            border-radius: 80%;
            position: relative;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
        }

        .balloon-string {
            width: 1px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform-origin: top center;
            animation: wiggle 3s infinite ease-in-out;
        }

        @keyframes wiggle {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-80%) rotate(8deg); }
            75% { transform: translateX(-50%) rotate(-5deg); }
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 0, 0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translate3d(0, -150vh, 0); opacity: 0; }
        }

        /* ১. এনিমেশন তৈরি করা */
@keyframes borderRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* ২. কন্টেইনার স্টাইল */
.container {
    position: relative;
    text-align: center;
    padding: 40px 30px;
    background: rgba(255, 255, 255, 0.05); /* গ্লাস ইফেক্ট */
    border-radius: 25px;
    overflow: hidden; /* বাইরের অংশ কেটে ফেলার জন্য */
    z-index: 10;
}

/* ৩. চিকন আলোর রেখা (যা ঘুরবে) */
.container::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
        transparent, 
        transparent, 
        transparent, 
        #ff2e7e, /* আপনার পছন্দের পিঙ্ক কালার */
        transparent
    );
    animation: borderRotate 4s linear infinite; /* ৪ সেকেন্ডে একবার ঘুরবে */
    z-index: -2;
}

/* ৪. ভেতরের কালো অংশ (যাতে আলোটা শুধু বর্ডারে দেখা যায়) */
.container::after {
    content: "";
    position: absolute;
    inset: 3px; /* বর্ডারের পুরুত্ব ৩ পিক্সেল */
    background: #0d0d0d; /* আপনার ব্যাকগ্রাউন্ডের সাথে মিল রেখে */
    border-radius: 22px;
    z-index: -1;
}

    
    body{
overflow-x:hidden !important;
}

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.6rem;
            color: var(--accent-pink);
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 46, 126, 0.5);
        }

        .countdown-wrapper {

        }

        }

        }

        .number { font-size: 1.2rem; font-weight: 600; display: block; }
        .label { font-size: 0.5rem; text-transform: uppercase; color: var(--soft-pink); }

        /* এন্ট্রেন্স এনিমেশন */
        @keyframes headerSlideDown {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* মেইন হেডার স্টাইল */
        .celestial-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-h);
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);

            z-index: 10000;

            animation: headerSlideDown 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .neon-wire {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;

            background: rgba(255, 255, 255, 0.1);
        }

        .wire-glow {
            position: absolute;
            height: 100%;
            width: 150px;
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
            box-shadow: 0 0 15px var(--neon-pink);
            animation: moveLight 4s infinite linear;
        }

        @keyframes moveLight {
            0% { left: -150px; }
            100% { left: 100%; }
        }

        .brand-zone {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-top {
            font-size: 8px;
            letter-spacing: 5px;
            color: var(--neon-pink);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .brand-main {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-heart {
            width: 6px;
            height: 6px;
            background: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-pink);
            animation: heartPulse 1.5s infinite;
        }

        @keyframes heartPulse {
            0% { transform: scale(1); box-shadow: 0 0 5px var(--neon-pink); }
            50% { transform: scale(1.6); box-shadow: 0 0 20px var(--neon-pink); }
            100% { transform: scale(1); box-shadow: 0 0 5px var(--neon-pink); }
        }

        .vibe-tag {
            font-family: sans-serif;
            font-size: 10px;
            letter-spacing: 2px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 8px;

        }
    
    .pp {
       font-size: 0.7rem;

    /* ডট লোডার অ্যানিমেশন */
.dot-loader::after {
    content: '';
    display: inline-block;
    width: 25px; /* ডটগুলোর জন্য জায়গা */
    text-align: left;
    animation: dots 2s steps(4, end) infinite;
    
}

@keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80% { content: '...'; }
    100% { content: '....'; }
}

        .design-status {
    position: absolute;
    bottom: 390px; /* কার্ডের নিচ থেকে দূরত্ব */
    left: 15px;   /* কার্ডের বাম দিক থেকে দূরত্ব */

}

.status-dot {
    width: 5px;
    height: 5px;
    background: #00ff00;

}

.status-text {
    font-size: 7px; /* সাইজ আরও ছোট করা হয়েছে */

    text-transform: uppercase;
}

@keyframes statusPulse {
    0% { opacity: 1; }

    100% { opacity: 1; }
}

    
    /* ফ্লোটিং হার্ট বাবল স্টাইল */
.heart-bubble {
    position: absolute;
    bottom: -50px; /* স্ক্রিনের নিচ থেকে শুরু হবে */
    color: rgba(255, 46, 126, 0.5); /* হালকা স্বচ্ছ পিঙ্ক */
    font-size: 15px;
    pointer-events: none;
    z-index: 1; /* এটি যেন মেইন কার্ডের পেছনে থাকে */
    animation: floatHeart var(--speed) linear forwards;
}

@keyframes floatHeart {
    0% { 
        transform: translateY(0) translateX(0) rotate(0deg); 
        opacity: 0; 
    }
    20% { 
        opacity: 0.8; 
    }
    80% { 
        opacity: 0.8; 
    }
    100% { 
        transform: translateY(-110vh) translateX(var(--randomX)) rotate(360deg); 
        opacity: 0; 
    }
}

    
    /* ১. মেমোরি লেন প্যারালাক্স স্টাইল */
.star, .balloon-container, .heart-bubble {
    transition: transform 0.2s ease-out; /* নড়াচড়া মসৃণ করার জন্য */
    will-change: transform;
}

/* ২. ব্যাকগ্রাউন্ডে একটি গভীরতা তৈরি করা */
#decor-container {
    perspective: 1000px;
    overflow: hidden;
}
    
    /* রাইট স্লাইডার স্টাইল */
.right-slider {
    position: fixed;
    right: -220px; /* শুরুতে ভেতরে লুকানো থাকবে */
    top: 20%;

    border: 1px solid rgba(255, 46, 126, 0.2);

    align-items: center;
    transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

}

    border: 1px solid rgba(255, 46, 126, 0.3);
    border-right: none;
    border-radius: 10px 0 0 10px;

}

.slider-handle span {

    color: #fff;
    letter-spacing: 2px;

    text-align: center;
}

/* ভেতরে থাকা কন্টেন্ট */

}

}

}

}

/* শিমার ইফেক্ট সংশোধন */
.shimmer {
    position: absolute;
    top: 0; 
    left: -100%; /* শুরুর পজিশন */
    width: 100%; 
    height: 100%;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(255,255,255,0.6),

    animation: shim 2.5s infinite linear;
}

    }
}


.perc-label { font-size: 8px; color: #fff; font-weight: bold; width: 25px; }

    /* নিয়ন অরা ট্রেইল স্টাইল */
.aura-trail {
    position: fixed;
    width: 30px;
    height: 30px;
    background: radial-gradient(circle, var(--neon-pink) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none; /* যাতে ক্লিকে বাধা না দেয় */
    z-index: 9998;
    filter: blur(8px);
    mix-blend-mode: screen;

    animation: fadeAura 1s ease-out forwards;
}

@keyframes fadeAura {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(3); opacity: 0; }
}

    /* ডায়নামিক ব্যাকগ্রাউন্ড আভা স্টাইল */
.bg-aura-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* এটি সবকিছুর পেছনে থাকবে */
    overflow: hidden;
    pointer-events: none;
}

.bg-aura {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--aura-glow) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.3;
    animation: moveAura 20s infinite alternate ease-in-out;
}

.aura-1 { top: -10%; left: -10%; animation-duration: 25s; }
.aura-2 { bottom: -10%; right: -10%; animation-duration: 30s; animation-delay: -5s; }

@keyframes moveAura {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20vw, 20vh) scale(1.2); }
    100% { transform: translate(-10vw, 30vh) scale(0.9); }

            const container = document.createElement('div');
            container.className = 'balloon-container';
            const balloon = document.createElement('div');
            balloon.className = 'balloon-body';

            setTimeout(() => { container.remove(); }, 16000);

        function initBalloons() { for(let i = 0; i < 5; i++) { setTimeout(createBalloon, i * 150); } }

        function update() {
            const now = new Date();
            let target = new Date(now.getFullYear(), 1, 11);
            if (now > target) target = new Date(now.getFullYear() + 1, 1, 11);
            const diff = target - now;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('days').innerText = d;
            document.getElementById('hours').innerText = h.toString().padStart(2,'0');
            document.getElementById('minutes').innerText = m.toString().padStart(2,'0');
            document.getElementById('seconds').innerText = s.toString().padStart(2,'0');
            setProgress('days-circle', d, 365);
            setProgress('hours-circle', h, 24);
            setProgress('minutes-circle', m, 60);
            setProgress('seconds-circle', s, 60);

            const circle = document.getElementById(id);
